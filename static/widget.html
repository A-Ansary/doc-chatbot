<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
:root{--c:#e11d2e;--bg:#ffffff;--fg:#1d1d22;--dim:#6b6b76;--line:#e7e7ec;--soft:#f4f4f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{background:var(--c);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header .dot{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700}
header b{display:block;font-size:15px}
header small{opacity:.85;font-size:12px}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.m{max-width:85%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.you{background:var(--c);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.typing{color:var(--dim);font-style:italic}
.src{margin-top:6px;font-size:11px;color:var(--dim)}
#book{margin:0 16px 8px;align-self:stretch;background:#fff;border:1.5px solid var(--c);color:var(--c);border-radius:10px;padding:9px;font-weight:600;cursor:pointer;font-size:13.5px}
#lead{display:none;flex-direction:column;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:#fff}
#lead.show{display:flex}
#lead input,#lead textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none}
#lead input:focus,#lead textarea:focus{border-color:var(--c)}
#lead .row{display:flex;gap:8px}
#lead button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
#lead .send{background:var(--c);color:#fff}
#lead .cancel{background:var(--soft);color:var(--fg)}
form#ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
#q{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 15px;font:inherit;font-size:14px;outline:none}
#q:focus{border-color:var(--c)}
form#ask button{width:40px;height:40px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:16px;cursor:pointer}
form#ask button:disabled{opacity:.5}
footer{text-align:center;font-size:10.5px;color:var(--dim);padding:0 0 8px;background:#fff}
</style>
</head>
<body>
<header><div class="dot" id="ini">?</div><div><b id="biz">Assistant</b><small>Usually replies instantly</small></div></header>
<div id="log"></div>
<button id="book" type="button">📅 Request appointment</button>
<form id="lead">
  <b style="font-size:14px">Request an appointment</b>
  <input id="ln" placeholder="Your name" required minlength="2" maxlength="80">
  <input id="lc" placeholder="Phone or email" required minlength="5" maxlength="120">
  <input id="lt" placeholder="Preferred day and time" maxlength="120">
  <textarea id="lo" rows="2" placeholder="Anything we should know? (optional)" maxlength="500"></textarea>
  <div class="row"><button type="button" class="cancel" id="lx">Cancel</button><button class="send">Send request</button></div>
</form>
<form id="ask"><input id="q" placeholder="Type your question…" autocomplete="off" dir="auto"><button aria-label="Send">➤</button></form>
<footer>AI assistant · answers come from our official information</footer>
<script>
const $ = s => document.querySelector(s), history = [], p = new URLSearchParams(location.search);
const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
if (/^#?[0-9a-f]{3,8}$/i.test(p.get("color") || "")) document.documentElement.style.setProperty("--c", "#" + p.get("color").replace("#", ""));
function add(cls, html){ const d = document.createElement("div"); d.className = "m " + cls; d.dir = "auto"; d.innerHTML = html;
  $("#log").appendChild(d); $("#log").scrollTop = 1e9; return d; }
fetch("/api/info").then(r => r.json()).then(j => {
  const name = p.get("title") || j.business; $("#biz").textContent = name; $("#ini").textContent = name.trim()[0].toUpperCase();
  add("ai", esc(p.get("welcome") || `Hi! 👋 I'm the ${name} assistant. Ask me about our services, hours or prices.`));
});
$("#ask").onsubmit = async e => {
  e.preventDefault(); const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; add("you", esc(q)); const btn = $("#ask button"); btn.disabled = true;
  const wait = add("ai typing", "Typing…");
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: q, history: history.slice(-10)})});
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Something went wrong");
    wait.className = "m ai"; wait.innerHTML = esc(j.answer);
    history.push({role: "user", content: q}, {role: "assistant", content: j.answer});
  } catch (err) { wait.className = "m ai"; wait.textContent = "⚠ " + err.message; }
  btn.disabled = false; $("#q").focus();
};
$("#book").onclick = () => { $("#lead").classList.add("show"); $("#book").style.display = "none"; $("#ln").focus(); };
$("#lx").onclick = () => { $("#lead").classList.remove("show"); $("#book").style.display = ""; };
$("#lead").onsubmit = async e => {
  e.preventDefault(); const b = $("#lead .send"); b.disabled = true;
  const body = {name: $("#ln").value.trim(), contact: $("#lc").value.trim(), preferred_time: $("#lt").value.trim(), note: $("#lo").value.trim()};
  const r = await fetch("/api/lead", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  b.disabled = false;
  if (!r.ok) { alert("Please check your name and contact details."); return; }
  $("#lead").reset(); $("#lx").click();
  add("ai", esc(`Thanks ${body.name}! Your request was sent - our team will contact you to confirm the appointment.`));
};
</script>
</body>
</html>
