<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Q&amp;A Chatbot</title>
<style>
:root{--bg:#0b0b0d;--panel:#141418;--line:#26262c;--fg:#f1f1f3;--dim:#8a8a94;--accent:#e11d2e;--you:#2a1013}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:grid;grid-template-columns:300px 1fr}
aside{border-right:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--panel)}
h1{font-size:18px;font-weight:600}
h1 span{color:var(--accent)}
.hint{font-size:13px;color:var(--dim);line-height:1.5}
#drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;transition:.2s}
#drop:hover,#drop.over{border-color:var(--accent);color:var(--fg)}
#docs{list-style:none;display:flex;flex-direction:column;gap:6px;overflow:auto}
#docs li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:#1b1b20;padding:8px 10px;border-radius:7px}
#docs li small{color:var(--dim)}
#docs button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px}
#docs button:hover{color:var(--accent)}
main{display:flex;flex-direction:column;height:100vh}
#log{flex:1;overflow:auto;padding:28px 10%;display:flex;flex-direction:column;gap:14px}
.m{max-width:75%;padding:12px 16px;border-radius:12px;line-height:1.55;font-size:15px;white-space:pre-wrap}
.m.ai{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.m.you{background:var(--you);border:1px solid #4a1a1f;align-self:flex-end}
.src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.src span{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.typing{color:var(--dim);font-style:italic}
form{display:flex;gap:10px;padding:18px 10%;border-top:1px solid var(--line)}
input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;color:var(--fg);font-size:15px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
form button{background:var(--accent);border:0;border-radius:10px;padding:0 22px;color:#fff;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<aside>
  <h1>Doc<span>Chat</span> assistant</h1>
  <p class="hint">Upload the business's documents (FAQ, policies, menu, manual). Customers then ask questions and get answers from those files, with sources.</p>
  <label id="drop">Drop PDF / TXT / MD files here<br>or click to choose<input id="file" type="file" accept=".pdf,.txt,.md" multiple hidden></label>
  <ul id="docs"></ul>
</aside>
<main>
  <div id="log"><div class="m ai">Hi! Ask me anything about our services, prices or policies.</div></div>
  <form id="ask"><input id="q" type="text" placeholder="Type your question…" autocomplete="off" dir="auto"><button>Send</button></form>
</main>
<script>
const $ = s => document.querySelector(s), history = [];
const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function loadDocs(){
  const {documents} = await (await fetch("/api/documents")).json();
  $("#docs").innerHTML = Object.entries(documents).map(([n, c]) =>
    `<li><span>${esc(n)} <small>${c} parts</small></span><button data-n="${esc(n)}" title="Remove">✕</button></li>`).join("")
    || `<li><small>No documents yet</small></li>`;
}
$("#docs").onclick = async e => { const n = e.target.dataset.n; if (!n) return;
  await fetch("/api/documents/" + encodeURIComponent(n), {method: "DELETE"}); loadDocs(); };

async function upload(files){
  for (const f of files) {
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/api/documents", {method: "POST", body: fd});
    if (!r.ok) alert((await r.json()).detail || "Upload failed");
  }
  loadDocs();
}
$("#file").onchange = e => upload(e.target.files);
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };

function add(cls, html){ const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html;
  $("#log").appendChild(d); $("#log").scrollTop = 1e9; return d; }

$("#ask").onsubmit = async e => {
  e.preventDefault(); const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; add("you", esc(q)); const btn = $("#ask button"); btn.disabled = true;
  const wait = add("ai typing", "Thinking…");
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: q, history: history.slice(-10)})});
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Something went wrong");
    wait.className = "m ai";
    wait.innerHTML = esc(j.answer) + (j.sources.length ? `<div class="src">${j.sources.map(s => `<span>${esc(s.file)} · p.${s.page}</span>`).join("")}</div>` : "");
    history.push({role: "user", content: q}, {role: "assistant", content: j.answer});
  } catch (err) { wait.className = "m ai"; wait.textContent = "⚠ " + err.message; }
  btn.disabled = false; $("#q").focus();
};
loadDocs();
</script>
</body>
</html>
